<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" fill="none">
  <title>A timed mock exam paper with question navigation and a flagged question</title>
  <!-- Original illustration. Brand palette only. -->
  <rect width="480" height="380" rx="28" fill="#0C3D4C"/>
  <path d="M0 352l18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16 18 16 18-16" stroke="#135568" stroke-width="5"/>

  <!-- Exam paper. -->
  <rect x="40" y="40" width="260" height="290" rx="16" fill="#FFFFFF"/>
  <rect x="40" y="40" width="260" height="46" rx="16" fill="#DAF2F8"/>
  <rect x="40" y="70" width="260" height="16" fill="#DAF2F8"/>
  <rect x="60" y="56" width="120" height="10" rx="5" fill="#135568"/>
  <rect x="220" y="56" width="60" height="10" rx="5" fill="#3B8DA7"/>
  <!-- Questions with mark allocation. -->
  <text x="60" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#135568">1</text>
  <rect x="80" y="108" width="160" height="9" rx="4.5" fill="#CDCAC5"/>
  <rect x="80" y="124" width="120" height="9" rx="4.5" fill="#E2DFDB"/>
  <rect x="252" y="106" width="30" height="18" rx="9" fill="#F0EDE9"/>
  <text x="60" y="170" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#135568">2</text>
  <rect x="80" y="160" width="170" height="9" rx="4.5" fill="#CDCAC5"/>
  <rect x="80" y="176" width="140" height="9" rx="4.5" fill="#E2DFDB"/>
  <rect x="252" y="158" width="30" height="18" rx="9" fill="#F0EDE9"/>
  <!-- Flagged question. -->
  <rect x="52" y="204" width="236" height="64" rx="10" fill="#FEF6EA"/>
  <text x="60" y="226" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#803F1B">3</text>
  <rect x="80" y="216" width="150" height="9" rx="4.5" fill="#FDD5A4"/>
  <rect x="80" y="232" width="110" height="9" rx="4.5" fill="#FDD5A4"/>
  <path d="M258 214v26" stroke="#BC661E" stroke-width="3" stroke-linecap="round"/>
  <path d="M259 215h18l-5 6 5 6h-18z" fill="#D9822A"/>
  <rect x="80" y="284" width="190" height="9" rx="4.5" fill="#E2DFDB"/>
  <rect x="80" y="300" width="150" height="9" rx="4.5" fill="#E2DFDB"/>

  <!-- Timer card. -->
  <rect x="320" y="40" width="120" height="120" rx="16" fill="#135568"/>
  <circle cx="380" cy="100" r="36" stroke="#0C3D4C" stroke-width="10"/>
  <path d="M380 64a36 36 0 1 1-34.2 47.1" stroke="#ED9D49" stroke-width="10" stroke-linecap="round"/>
  <path d="M380 84v16l10 8" stroke="#DAF2F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Question navigator grid. -->
  <rect x="320" y="180" width="120" height="150" rx="16" fill="#FFFFFF"/>
  <rect x="338" y="198" width="22" height="22" rx="6" fill="#117089"/>
  <rect x="369" y="198" width="22" height="22" rx="6" fill="#117089"/>
  <rect x="400" y="198" width="22" height="22" rx="6" fill="#D9822A"/>
  <rect x="338" y="229" width="22" height="22" rx="6" fill="#117089"/>
  <rect x="369" y="229" width="22" height="22" rx="6" stroke="#A4A19C" stroke-width="2"/>
  <rect x="400" y="229" width="22" height="22" rx="6" stroke="#A4A19C" stroke-width="2"/>
  <rect x="338" y="260" width="22" height="22" rx="6" stroke="#A4A19C" stroke-width="2"/>
  <rect x="369" y="260" width="22" height="22" rx="6" stroke="#A4A19C" stroke-width="2"/>
  <rect x="400" y="260" width="22" height="22" rx="6" stroke="#A4A19C" stroke-width="2"/>
  <rect x="338" y="296" width="84" height="18" rx="9" fill="#135568"/>
