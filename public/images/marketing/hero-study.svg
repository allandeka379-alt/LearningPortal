<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" fill="none">
  <title>A practice question card with an answer being checked, beside a progress ring</title>
  <!-- Original illustration. Brand palette: Zambezi (teal-blue), Msasa (amber), Granite (warm neutrals). -->
  <rect width="560" height="440" rx="28" fill="#0C3D4C"/>
  <!-- Chevron coursing motif (Great Zimbabwe walls), quiet. -->
  <path d="M0 404l20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18 20-18 20 18" stroke="#135568" stroke-width="5" stroke-linejoin="miter"/>
  <path d="M24 420h512" stroke="#135568" stroke-width="3" stroke-dasharray="40 8"/>

  <!-- Card stack: back card. -->
  <rect x="78" y="46" width="300" height="236" rx="18" fill="#135568"/>
  <!-- Question card. -->
  <rect x="56" y="66" width="300" height="250" rx="18" fill="#FFFFFF"/>
  <rect x="80" y="90" width="64" height="10" rx="5" fill="#BAE3F0"/>
  <rect x="80" y="114" width="232" height="10" rx="5" fill="#CDCAC5"/>
  <rect x="80" y="132" width="180" height="10" rx="5" fill="#CDCAC5"/>
  <!-- Options. -->
  <rect x="80" y="160" width="252" height="30" rx="9" fill="#F8F6F3" stroke="#E2DFDB" stroke-width="2"/>
  <circle cx="98" cy="175" r="7" stroke="#A4A19C" stroke-width="2.5"/>
  <rect x="114" y="171" width="120" height="8" rx="4" fill="#E2DFDB"/>
  <rect x="80" y="198" width="252" height="30" rx="9" fill="#EEF9FC" stroke="#117089" stroke-width="2.5"/>
  <circle cx="98" cy="213" r="8" fill="#117089"/>
  <path d="M94.5 213l2.5 2.6 5-5.2" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="209" width="150" height="8" rx="4" fill="#91CCDF"/>
  <rect x="80" y="236" width="252" height="30" rx="9" fill="#F8F6F3" stroke="#E2DFDB" stroke-width="2"/>
  <circle cx="98" cy="251" r="7" stroke="#A4A19C" stroke-width="2.5"/>
  <rect x="114" y="247" width="96" height="8" rx="4" fill="#E2DFDB"/>
  <!-- Check answer button. -->
  <rect x="80" y="278" width="104" height="24" rx="8" fill="#135568"/>
  <rect x="98" y="287" width="68" height="6" rx="3" fill="#BAE3F0"/>

  <!-- Progress card with ring (no numbers: it is an illustration, not a claim). -->
  <rect x="328" y="170" width="184" height="190" rx="18" fill="#FFFFFF"/>
  <circle cx="420" cy="244" r="44" stroke="#F0EDE9" stroke-width="12"/>
  <path d="M420 200a44 44 0 0 1 41.8 57.6" stroke="#D9822A" stroke-width="12" stroke-linecap="round"/>
  <path d="M461.8 257.6A44 44 0 0 1 390 276" stroke="#117089" stroke-width="12" stroke-linecap="round"/>
  <path d="M410 238l6 6 12-12" stroke="#135568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="352" y="306" width="136" height="8" rx="4" fill="#E2DFDB"/>
  <rect x="352" y="306" width="88" height="8" rx="4" fill="#3B8DA7"/>
  <rect x="352" y="326" width="136" height="8" rx="4" fill="#E2DFDB"/>
  <rect x="352" y="326" width="112" height="8" rx="4" fill="#ED9D49"/>

  <!-- Timer pill. -->
  <rect x="384" y="62" width="128" height="44" rx="22" fill="#FDD5A4"/>
  <circle cx="410" cy="84" r="11" stroke="#803F1B" stroke-width="3"/>
  <path d="M410 78v6l4 3" stroke="#803F1B" stroke-width="3" stroke-linecap="round"/>
  <rect x="430" y="79" width="62" height="10" rx="5" fill="#BC661E"/>
  <!-- Small chevron mark. -->
  <path d="M396 132l14-12 14 12 14-12 14 12" stroke="#91CCDF" stroke-width="5" stroke-linejoin="miter"/>
</svg>
